<html>
	<head>
	<title>Newsletter</title>
	<style>
	#message{
		width:100%;
		margin-top:80px;
	}
	#newslettercontainer{
				background:url("img/mail_sepia.png") no-repeat 0 0;
				width:240px;
				height:250px;
				text-align:center;
				padding-top:30px;
	}
	</style>
	<div id='newslettercontainer'>
	<form id='newsletterForm' METHOD="POST" action="javascript:registerNewsletter()" enctype="multipart/form-data">
		<input id='email' name='email' type='email' value='Entrez votre email'/>
		<br><br><input type="submit" value="s'inscrire"/>
		<div id='message'></div>
	</form>
	</div>
<script src="js/jquery.js" type="text/javascript"></script>
<script type="text/javascript">
var enable_delete_click = true;
$("#email").click(
	function() {
		if(enable_delete_click)
		{
			$(this).val("");
			enable_delete_click = false;
		}
	}
);

function colorizedErrorFields(fields){
	for (var i in fields)
	{
	  $("#"+fields[i]+"").css("border",'1px solid red');
	}
}

function registerNewsletter(){
$.post("register_newsletter.php", $("#newsletterForm").serialize(), 
	function(data)
	{
		obj = $.parseJSON(data);
		if(obj.error)
			$("#message").css("color","red");
		else
			$("#message").css("color","green");
			
		$("#message").html(obj.message);
		
	}
).error(function() { alert("Erreur lors de l'envoi, veuillez reessayer ou nous contacter: contact@lovelywedding.fr")});
}
</script>
