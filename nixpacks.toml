[variables]
# Nginx docroot points at our public/ folder so .env, src/, vendor/, etc.
# stay outside the web tree.
NIXPACKS_PHP_ROOT_DIR = "public"
# Front controller pattern: any unmatched URL falls back to index.php,
# which dispatches to the LovelyWedding\Http\Router.
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"
